name: SiftGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build

  regression-acceptance:
    name: Fault-injection acceptance
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' && vars.SIFTGUARD_BASE_URL != '' }}

    env:
      SIFTGUARD_BASE_URL: ${{ vars.SIFTGUARD_BASE_URL }}
      SIFTGUARD_ADMIN_TOKEN: ${{ secrets.SIFTGUARD_ADMIN_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify missing-document regression detection
        run: node scripts/siftguard-regression-smoke.mjs --scenario exclude_expected_document

      - name: Verify tenant-isolation regression detection
        run: node scripts/siftguard-regression-smoke.mjs --scenario wrong_tenant_filter

  custom-suite-release-gate:
    name: Custom contract release gate
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' && vars.SIFTGUARD_BASE_URL != '' && vars.SIFTGUARD_SUITE_ID != '' }}

    env:
      SIFTGUARD_BASE_URL: ${{ vars.SIFTGUARD_BASE_URL }}
      SIFTGUARD_SUITE_ID: ${{ vars.SIFTGUARD_SUITE_ID }}
      SIFTGUARD_ADMIN_TOKEN: ${{ secrets.SIFTGUARD_ADMIN_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate configured contract suite
        run: node scripts/siftguard-suite.mjs --suite "$SIFTGUARD_SUITE_ID" --report siftguard-report.json

      - name: Upload evaluation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: siftguard-contract-report
          path: siftguard-report.json
          if-no-files-found: ignore